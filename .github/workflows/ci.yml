name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flake8
        run: flake8 app tests

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t finance-calculator .

  deploy:
    name: Deploy to WSL
    runs-on: [self-hosted, production]
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop old container
        run: docker stop finance-calculator || true

      - name: Remove old container
        run: docker rm finance-calculator || true

      - name: Build Docker image
        run: docker build -t finance-calculator .

      - name: Start application
        run: |
          docker run -d \
            --restart unless-stopped \
            --name finance-calculator \
            -p 5000:5000 \
            finance-calculator

      - name: Check application
        run: |
          sleep 5
          curl -f http://localhost:5000/health
